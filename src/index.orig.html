<body style="margin: 0">
    <canvas id="c" style="width: 100vw; height: 100vh"></canvas>
    <script>
        // For testing, removed in minified code
        function glsl(str) {
            return str;
        }

        c.width = innerWidth;
        c.height = innerHeight;
        gl = c.getContext("webgl2");
        program = gl.createProgram();

        [
            glsl`#version 300 es
            uniform vec3 pos; // position
            uniform vec3 col; // color
            uniform vec3 camTar; // camera target
            uniform vec2 camAng; // camera angle, x = yaw, y = pitch
            uniform float camDist; // camera distance from target
            uniform float a; // canvas aspect ratio

            out vec3 vc;

            mat2 rot(float angle) {
              return mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
            }

            void main() {
              int f = gl_VertexID / 6; // face index
              int axis = f / 2; // face axis: 0 = X, 1 = Y, 2 = Z
              float side = float(f % 2); // 0 = negative side, 1 = positive side
              int k = int[](0, 1, 2, 2, 1, 3)[gl_VertexID % 6]; // one face is from two triangles (0, 1, 2) and (2, 1, 3)

              vec3 loc; // local position
              loc[axis] = side;
              loc[(axis + 1) % 3] = float(k & 1);
              loc[(axis + 2) % 3] = float(k >> 1);

              // only faces looking in the positive direction get light
              vec3 light = normalize(vec3(0.4, 0.5, 0.6));
              vc = col * (0.4 + 0.6 * side * light[axis]);

              vec3 p = loc + pos - camTar;
              p.xz *= rot(camAng.x);
              p.yz *= rot(camAng.y);
              p.z += camDist;

              float foc = 1.5; // focal

              gl_Position = vec4(p.x * foc / a, p.y * foc, p.z - 0.1, p.z);
            }
            `,
            glsl`#version 300 es
            precision mediump float;

            in vec3 vc;
            out vec4 outColor;

            void main() {
              outColor = vec4(vc, 1.0);
            }
            `,
        ].map((source, i) => {
            const shader = gl.createShader(gl.VERTEX_SHADER - i);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            gl.attachShader(program, shader);
        });

        gl.linkProgram(program);
        gl.useProgram(program);
        gl.enable(gl.DEPTH_TEST);

        uniforms = {};
        ["pos", "col", "camTar", "camAng", "camDist", "a"].forEach((name) => {
            uniforms[name] = gl.getUniformLocation(program, name);
        });

        gl.viewport(0, 0, c.width, c.height);
        gl.uniform1f(uniforms.a, c.width / c.height);

        function drawCube(x, y, z, r, g, b) {
            gl.uniform3f(uniforms.pos, x, y, z);
            gl.uniform3f(uniforms.col, r, g, b);
            gl.drawArrays(gl.TRIANGLES, 0, 36);
        }

        function setCamera(targetX, targetY, targetZ, yaw, pitch, dist) {
            gl.uniform3f(uniforms.camTar, targetX, targetY, targetZ);
            gl.uniform2f(uniforms.camAng, yaw, pitch);
            gl.uniform1f(uniforms.camDist, dist);
        }

        keys = {};
        addEventListener("keydown", (e) => {
            keys[e.code] = true;
        });
        addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        W = 11;
        H = 11;
        map =
            "0x1xxx2xxxx" +
            "9x5xxxxxxx3" +
            "xxxxxx4xxxx" +
            "xx6xxxx7999" +
            "9xxx6xxxxx9" +
            "xxxxx9xx009" +
            "99999999009" +
            "7xxx8xxxxxx" +
            "xx6xxx6xxx5" +
            "xx3xxx4xxx4" +
            "xx2xxx2xx01";

        function isSolid(x, y, z) {
            if (x < 0 || x > H - 1 || z < 0 || z > W - 1) return 0;
            return y >= -1 && y < map[x + z * W];
        }

        E = 1e-4; // tolerance
        function hit(x, y, z) {
            for (i = Math.floor(x + E); i < x + 1 - E; i++)
                for (j = Math.floor(y + E); j < y + 1 - E; j++)
                    for (k = Math.floor(z + E); k < z + 1 - E; k++)
                        if (isSolid(i, j, k)) return true;
            return false;
        }

        player = { x: 0, y: 0, z: 0, vy: 0, g: false }; // x, y, z, y velocity, ground
        camera = { y: 0.6, p: -0.6 }; // yaw, pitch

        last = 0;

        function loop(time) {
            dt = Math.min((time - last) / 1000, 0.05);
            last = time;

            camera.y +=
                ((keys.ArrowRight ?? 0) - (keys.ArrowLeft ?? 0)) * 4 * dt;
            camera.p += ((keys.ArrowDown ?? 0) - (keys.ArrowUp ?? 0)) * 4 * dt;

            moveY = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
            moveX = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
            len = Math.hypot(moveY, moveX) || 1;
            moveY /= len;
            moveX /= len;
            sin = Math.sin(camera.y);
            cos = Math.cos(camera.y);
            dx = (moveY * sin + moveX * cos) * dt * 4;
            dz = (moveY * cos - moveX * sin) * dt * 4;

            if (!hit(player.x + dx, player.y, player.z)) player.x += dx;
            if (!hit(player.x, player.y, player.z + dz)) player.z += dz;

            if (keys.Space && player.g) player.vy = 10;
            player.vy = Math.max(player.vy - 25 * dt, -15);
            ny = player.y + player.vy * dt;
            player.g = false;
            if (hit(player.x, ny, player.z)) {
                if (player.vy < 0) {
                    player.y = Math.floor(ny + E) + 1;
                    player.g = true;
                }
                player.vy = 0;
            } else {
                player.y = ny;
            }

            if (player.y < -3) player = { x: 0, y: 0, z: 0, vy: 0, g: false };
            if (
                Math.round(player.x) == 0 &&
                player.y == 9 &&
                Math.round(player.z) == 1
            ) {
                alert("You won!!!");
                location.reload();
            }
            gl.clearColor(0.5, 0.8, 0.9, 1);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            setCamera(
                player.x + 0.5,
                player.y + 0.5,
                player.z + 0.5,
                camera.y,
                camera.p,
                9,
            );

            for (x = 0; x < H; x++) {
                for (z = 0; z < W; z++) {
                    for (y = -1; y < map[x + z * W]; y++) {
                        d = 0.2 + ((y / 12) % 0.8);
                        if (x == 0 && y == 8 && z == 1)
                            drawCube(x, y, z, 1, 1, 0);
                        else drawCube(x, y, z, d, d, d);
                    }
                }
            }

            drawCube(player.x, player.y, player.z, 0.5, 1, 0.5);

            requestAnimationFrame(loop);
        }

        alert("WASD - move\nArrows - rotate camera\nSpace - jump\nHave fun!");
        requestAnimationFrame(loop);
    </script>
</body>
